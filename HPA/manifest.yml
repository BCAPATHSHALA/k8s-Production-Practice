# ----------------------------
# Deployment: Runs 2 replicas of the app with CPU-intensive image
# ----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-deployment
spec:
  replicas: 2  # Initial hardcoded replica count, HPA will overwrite this
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
    spec:
      containers:
        - name: cpu-app
          image: 100xdevs/week-28:latest  # Image with CPU load app
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"     # Minimum guaranteed CPU (0.1 core)
              memory: "128Mi" # Minimum guaranteed memory
            limits:
              cpu: "1000m"    # Maximum CPU this container can use (1 core)
              memory: "256Mi" # Maximum memory this container can use
# HPA will scale based on CPU utilization relative to 'requests' (100m)

---

# ----------------------------
# Service: Exposes the deployment using a LoadBalancer
# ----------------------------
apiVersion: v1
kind: Service
metadata:
  name: cpu-service
spec:
  selector:
    app: cpu-app  # Must match Deployment labels
  ports:
    - protocol: TCP
      port: 80         # External port
      targetPort: 3000 # Pod's containerPort
  type: LoadBalancer   # Exposes to external traffic (in cloud environments)

---

# ----------------------------
# Horizontal Pod Autoscaler (HPA): Auto-scales based on CPU usage
# ----------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-deployment  # Target the deployment above
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50  # Target average CPU usage is 50%
          # HPA tries to keep average CPU utilization at 50% of the request (100m)
          # So 50% of 100m = 50m. If actual usage goes above 50m, it may scale up.